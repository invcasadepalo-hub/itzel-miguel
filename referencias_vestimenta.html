<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Referencias de vestimenta | Itzel & Miguel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap');
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f7f3e9;color:#697647;font-family:'Cormorant Garamond',Georgia,serif}
body{min-height:100vh;display:flex;flex-direction:column}
header{text-align:center;padding:22px 16px 14px}
h1{font-size:clamp(24px,4vw,36px);font-weight:300;letter-spacing:.09em;text-transform:uppercase;margin:0}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 14px 20px}
.carousel{width:min(100%,1050px);display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:12px;align-items:center}
.stage{display:flex;justify-content:center;align-items:center;min-height:50vh}
#photo{display:block;max-width:100%;max-height:72vh;width:auto;height:auto;object-fit:contain}
.nav{height:44px;width:44px;border-radius:50%;border:1px solid #697647;background:#697647;color:#f7f3e9;font-size:28px;cursor:pointer}
.counter{text-align:center;font:13px Arial,sans-serif;letter-spacing:.04em;padding:0 0 20px;color:#697647}
@media(max-width:520px){header{padding-top:18px}.carousel{grid-template-columns:36px minmax(0,1fr) 36px;gap:5px}.nav{width:34px;height:34px;font-size:23px}.stage{min-height:45vh}#photo{max-height:70vh}}
</style>
</head>
<body>
<header><h1>Referencias de vestimenta</h1></header>
<main>
  <div class="carousel">
    <button class="nav" id="prev" aria-label="Imagen anterior">&#8249;</button>
    <div class="stage"><img id="photo" src="vestimenta-01.jpg" alt="Referencia de vestimenta 1"></div>
    <button class="nav" id="next" aria-label="Imagen siguiente">&#8250;</button>
  </div>
</main>
<div class="counter" id="counter">1 / 8</div>
<script>
const images = Array.from({length:8},(_,i)=>`vestimenta-${String(i+1).padStart(2,'0')}.jpg`);
let current=0;
const photo=document.getElementById('photo'), counter=document.getElementById('counter');
function show(i){current=(i+images.length)%images.length;photo.src=images[current];photo.alt=`Referencia de vestimenta ${current+1}`;counter.textContent=`${current+1} / ${images.length}`;}
document.getElementById('prev').addEventListener('click',()=>show(current-1));
document.getElementById('next').addEventListener('click',()=>show(current+1));
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});
let x=0;photo.addEventListener('touchstart',e=>x=e.changedTouches[0].screenX,{passive:true});
photo.addEventListener('touchend',e=>{let d=e.changedTouches[0].screenX-x;if(Math.abs(d)>40)show(current+(d<0?1:-1))},{passive:true});
</script>
</body>
</html>
